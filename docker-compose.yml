version: '3.8'

services:
  patient-service-db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - patient-management

  billing-service:
    build: ./billing-service
    ports:
      - "4101:4101"  # Map host port 4002 to container port 4001
      - "9002:9001"  # Map host port 9002 to container port 9001
    depends_on:
      - patient-service-db
    networks:
      - patient-management

  patient-service:
    build: ./patient-service
    ports:
      - "4000:4000"
    depends_on:
      - patient-service-db
      - billing-service
    env_file:
      - .env
    networks:
      - patient-management

networks:
  patient-management:
    driver: bridge